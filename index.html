<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veora – TikTok Video Downloader Online</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0b;
    --line:#2a2a2a;
    --ink:#0b0b0b;
    --white:#fff;
    --muted:#bdbdbd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Lato',system-ui,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--bg);border-bottom:1px solid var(--line);padding:16px;display:flex;justify-content:center;align-items:center}
  .logo{display:block;height:84px;width:auto;max-width:90%}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:48px 20px 40px;text-align:center}
  h1{font-size:clamp(30px,8vw,46px);line-height:1.2;font-weight:700}
  .sub{margin:22px auto 28px;font-size:clamp(16px,4.4vw,19px);line-height:1.5;color:var(--muted)}
  .input-wrap{display:flex;align-items:center;background:var(--white);border:2px solid #fff;border-radius:12px;padding:6px}
  .input-wrap input{flex:1;min-width:0;border:0;outline:0;font:400 17px 'Roboto',sans-serif;padding:12px 12px;color:#222;background:transparent}
  .input-wrap input::placeholder{color:#777}
  .paste{width:56px;height:52px;border:0;border-radius:9px;background:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
  .paste svg{width:26px;height:26px}
  .go{margin-top:20px;width:100%;border:0;border-radius:10px;background:var(--white);color:var(--ink);font:700 22px 'Lato',sans-serif;letter-spacing:1.5px;padding:18px;cursor:pointer;transition:background .15s}
  .go:hover{background:#e2e2e2}
  .go:disabled{opacity:.7;cursor:wait}
  .go:focus-visible,.paste:focus-visible,.btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  .note{margin-top:28px;font-size:17px;line-height:1.5}
  .note{color:var(--muted)}
  #status{margin-top:18px;min-height:24px;font-size:16px;font-weight:700}
  .err{background:#1c1c1c;border:1px solid #fff;padding:10px 14px;border-radius:8px;display:inline-block}
  .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

  .result{display:none;margin-top:24px;background:var(--white);color:var(--ink);border-radius:14px;overflow:hidden;text-align:left;border:1px solid var(--white)}
  .result.show{display:block}
  .thumb{position:relative;background:#000;display:flex;justify-content:center}
  .thumb img{display:block;max-width:100%;max-height:420px;object-fit:contain}
  .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:3px 8px;border-radius:6px}
  .info{padding:16px 18px 6px}
  .author{font-weight:700;color:#555;margin-bottom:6px}
  .caption{font-size:16px;line-height:1.45;word-break:break-word}
  .actions{padding:14px 18px 20px;display:grid;gap:10px}
  .btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:9px;font:700 17px 'Lato',sans-serif;padding:14px;cursor:pointer;color:#fff}
  .btn.mp4{background:#0b0b0b}
  .btn.hd{background:#0b0b0b}
  .btn.mp3{background:#fff;color:#0b0b0b;border:2px solid #0b0b0b}
  .btn:hover{opacity:.85}
  footer{text-align:center;padding:20px 16px 28px;font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const urlInput = $('url'), goBtn = $('goBtn'), statusEl = $('status'), result = $('result');
  const API = 'https://www.tikwm.com/api/?hd=1&url=';

  $('pasteBtn').addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) { urlInput.value = t.trim(); urlInput.focus(); }
    } catch (e) {
      showError('Paste is blocked by your browser. Long-press the box and choose Paste.');
    }
  });

  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchVideo(); });
  goBtn.addEventListener('click', fetchVideo);

  function showError(msg){
    statusEl.innerHTML = '';
    const s = document.createElement('span');
    s.className = 'err'; s.textContent = msg;
    statusEl.appendChild(s);
  }

  function fmtDur(sec){
    if (!sec) return '';
    const m = Math.floor(sec/60), s = String(sec%60).padStart(2,'0');
    return m + ':' + s;
  }

  function isTikTok(u){
    try { const h = new URL(u).hostname; return /(^|\.)tiktok\.com$/.test(h); }
    catch(e){ return false; }
  }

  async function getData(link){
    const res = await fetch(API + encodeURIComponent(link));
    const json = await res.json();
    if (json.code !== 0 || !json.data) throw new Error(json.msg || 'Video not found');
    return json.data;
  }

  async function fetchVideo(){
    // pull the first link out of whatever was pasted (shared text may include a caption)
    const m = urlInput.value.match(/https?:\/\/[^\s]+/);
    const link = m ? m[0] : urlInput.value.trim();
    if (m) urlInput.value = link;
    result.classList.remove('show');
    if (!link){ showError('Paste a TikTok link first.'); return; }
    if (!isTikTok(link)){ showError('That is not a TikTok link. Example: https://www.tiktok.com/@user/video/123…'); return; }

    goBtn.disabled = true;
    statusEl.innerHTML = '<span class="spinner"></span>Getting video…';

    let data = null, lastErr = null;
    for (let i = 0; i < 3 && !data; i++){
      try { data = await getData(link); }
      catch (err) {
        lastErr = err;
        if (i < 2) await new Promise(r => setTimeout(r, 1800)); // the free API allows ~1 request/second
      }
    }
    if (data){ render(data); statusEl.textContent = ''; }
    else showError('Could not get the video (' + (lastErr && lastErr.message ? lastErr.message : 'network error') + '). Try again in a few seconds.');
    goBtn.disabled = false;
  }

  function abs(u){ return u && u.startsWith('/') ? 'https://www.tikwm.com' + u : u; }

  function render(d){
    $('thumb').src = abs(d.cover || d.origin_cover);
    $('dur').textContent = fmtDur(d.duration);
    $('author').textContent = d.author ? '@' + (d.author.unique_id || d.author.nickname) : '';
    $('caption').textContent = d.title || '(No caption)';

    const name = 'veora_' + (d.id || Date.now());
    setupDownload($('dlMp4'), abs(d.play), name + '.mp4');
    if (d.hdplay){ $('dlHd').style.display = 'block'; setupDownload($('dlHd'), abs(d.hdplay), name + '_hd.mp4'); }
    else $('dlHd').style.display = 'none';
    setupDownload($('dlMp3'), abs(d.music), name + '.mp3');

    result.classList.add('show');
    result.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function setupDownload(a, href, filename){
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.onclick = async function(e){
      e.preventDefault();
      const original = a.textContent;
      a.textContent = 'Downloading…';
      try {
        const r = await fetch(href);
        if (!r.ok) throw new Error('bad response');
        const blob = await r.blob();
        const objUrl = URL.createObjectURL(blob);
        const tmp = document.createElement('a');
        tmp.href = objUrl; tmp.download = filename;
        document.body.appendChild(tmp); tmp.click(); tmp.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 10000);
      } catch (err) {
        window.open(href, '_blank', 'noopener');
      } finally {
        a.textContent = original;
      }
    };
  }
})();
</script>
</body>
</html>
